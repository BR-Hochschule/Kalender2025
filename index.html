<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Betriebsratskalender 2025</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <!-- Overlay für die Überraschungs-Karten -->
    <div
      class="surprise-overlay"
      id="surpriseOverlay"
      aria-hidden="true"
    >
      <div
        class="surprise-card"
        id="surpriseCard"
        role="dialog"
        aria-modal="true"
        aria-live="polite"
        tabindex="-1"
      ></div>
    </div>

    <main class="calendar" id="calendar">
      <h1 class="calendar-title">
        <span class="calendar-title-inner">
          <span class="calendar-title-icon" aria-hidden="true">🎄</span>
          <span class="calendar-title-text">Betriebsratskalender</span>
          <span class="calendar-title-icon" aria-hidden="true">⭐</span>
        </span>
      </h1>

      <section
        class="doors"
        id="doors"
        aria-label="Tägliche Türchen mit kleinen Impulsen und Überraschungen"
      >
        <noscript>
          Bitte aktiviere JavaScript, um den Kalender verwenden zu können.
        </noscript>
      </section>
    </main>
  </body>
</html>
